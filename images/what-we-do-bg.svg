  <path d="M0 760 L120 700 L230 735 L360 660 L470 710 L600 640 L720 700 L840 630 L980 705 L1100 650 L1230 715 L1360 655 L1480 710 L1600 670 V1000 H0Z" fill="#b7d3e3" opacity="0.85"/>
