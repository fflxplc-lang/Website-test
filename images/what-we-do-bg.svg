  <rect y="700" width="1600" height="160" fill="url(#haze)"/>
  <!-- near mountains -->
  <path d="M0 910 L170 840 L320 890 L480 830 L640 900 L800 845 L960 905 L1120 850 L1280 910 L1440 860 L1600 900 V1000 H0Z" fill="#6f9cb8"/>
  <path d="M0 960 L200 915 L420 950 L640 910 L860 955 L1080 915 L1300 955 L1600 920 V1000 H0Z" fill="#557f9c"/>
</svg>
