<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f28a2e"/>
      <stop offset="0.16" stop-color="#f8b25e"/>
      <stop offset="0.38" stop-color="#fde3bf"/>
      <stop offset="0.62" stop-color="#fdf3e4"/>
      <stop offset="0.82" stop-color="#d9e9f1"/>
      <stop offset="1" stop-color="#a9cde0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="210" r="260" fill="url(#sun)"/>
